<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Transfer Oxygen Calculator</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-soft: #f0f9ff;
      --ok-bg: #f0fdf4;
      --ok-border: #bbf7d0;
      --ok-text: #166534;
      --bad-bg: #fef2f2;
      --bad-border: #fecaca;
      --bad-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 20px 16px 40px;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .section-header {
      background: #f1f5f9;
      padding: 9px 16px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      border-top: 1px solid var(--border);
    }

    .section-header:first-child {
      border-top: none;
    }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      gap: 14px;
    }

    .input-row:last-child {
      border-bottom: none;
    }

    .input-label {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
    }

    .input-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
